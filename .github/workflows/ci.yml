name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pounce
          POSTGRES_PASSWORD: pounce
          POSTGRES_DB: pounce
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pounce"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://pounce:pounce@localhost:5432/pounce
      REDIS_URL: redis://localhost:6379
      # Empty when the secret is not set (e.g. PRs from forks). No current test
      # calls Telegram; a future one that does must skip when this is empty.
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      # Worker tests run against the real schema.
      - run: pnpm db:migrate
      - run: pnpm test
